upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

# map must be in the http context (conf.d/ files are included inside http {}).
# Defines $connection_upgrade for WebSocket proxying.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500m;

    # API: proxy to FastAPI backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for log streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # VNC token validation — internal subrequest for auth_request.
    # The VNC location passes token via X-VNC-Token header; this internal
    # location forwards it to the backend as a query parameter.
    location = /vnc-validate {
        internal;
        proxy_pass http://backend/api/v1/vnc/validate?token=$http_x_vnc_token;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    # VNC proxy: validate token embedded in URL path, then proxy to noVNC container.
    #
    # Token is in the path (not query string) to prevent it appearing in
    # Nginx access.log entries and Referer headers.
    #
    # URL format: /vnc/{token}/           (noVNC HTML interface)
    #             /vnc/{token}/websockify  (WebSocket VNC connection)
    #             /vnc/{token}/vnc.html    (noVNC static assets)
    #
    # Flow:
    #   1. Extract {token} from URL path into $vnc_token
    #   2. Set X-VNC-Token header so /vnc-validate can forward it as ?token=
    #   3. auth_request /vnc-validate → backend validates token, returns X-VNC-Port
    #   4. $vnc_port captured from auth sub-request response header
    #   5. Proxy remaining URL path to VNC container on 127.0.0.1:$vnc_port
    location ~ ^/vnc/([^/]+)(/.*)? {
        set $vnc_token $1;
        set $vnc_suffix $2;

        proxy_set_header X-VNC-Token $vnc_token;

        auth_request /vnc-validate;
        auth_request_set $vnc_port $upstream_http_x_vnc_port;

        proxy_pass http://127.0.0.1:$vnc_port$vnc_suffix$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 7200s;
    }

    # Frontend: proxy to React/Vite dev server or static build
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # React Router: fallback to index.html
        proxy_intercept_errors on;
        error_page 404 = @frontend_fallback;
    }

    location @frontend_fallback {
        proxy_pass http://frontend;
    }
}
