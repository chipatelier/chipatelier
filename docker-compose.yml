services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chipatelier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-chipatelier}
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chipatelier}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - ${DATA_ROOT}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ${DATA_ROOT}/minio:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # AI inference service — optional, activate with: docker compose --profile ollama up
  # Skip this profile if you have an external Ollama instance; set OLLAMA_BASE_URL in .env.
  # Volume: mounted at /ollama (not /root/.ollama) to avoid the /root directory 700
  # permission problem. OLLAMA_MODELS tells Ollama to use this path instead of ~/.ollama.
  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    volumes:
      - ${DATA_ROOT}/ollama:/ollama
    ports:
      # Bind to localhost only — Ollama API must not be reachable from outside the host.
      - "127.0.0.1:11434:11434"
    environment:
      # Store models at /ollama instead of /root/.ollama — avoids the /root 700
      # permission issue that prevents Docker from writing to the named volume.
      - OLLAMA_MODELS=/ollama
      # OLLAMA_HOST must be 0.0.0.0 so the container listens on all interfaces
      # (the localhost-only restriction is enforced by the port binding above).
      - OLLAMA_HOST=0.0.0.0:11434
      # Limit to one loaded model at a time — prevents multiple large models
      # from accumulating in RAM on a CPU-constrained server.
      - OLLAMA_MAX_LOADED_MODELS=1
    restart: unless-stopped
    # Uncomment to enable GPU acceleration (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-chipatelier}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-chipatelier}
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # ORFS job workers — dedicated queue for long-running ORFS jobs
  # Consumes both high_priority (instructor/admin) and orfs_jobs (student) queues.
  # Queue list order ensures high_priority tasks are polled first.
  orfs-worker:
    build:
      context: ./worker
    command: >
      celery -A celery_app worker
      -Q high_priority,orfs_jobs
      -c ${ORFS_WORKER_CONCURRENCY:-4}
      --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}/artifacts:/data/artifacts
      # Workspace scratch dir must be a host bind-mount (not a named volume).
      # Worker writes workspace files here; Docker API references this same HOST
      # path when mounting into ORFS job containers.
      - ${WORKSPACE_ROOT}:/tmp/chipatelier_workspaces
    restart: unless-stopped

  # Background workers — dedicated queue for tiles, grading, AI hints
  # Also runs Celery Beat (--beat) to dispatch periodic tasks (drain_queue, watchdog).
  # Safe to combine because only one background-worker instance ever runs.
  background-worker:
    build:
      context: ./worker
    command: >
      celery -A celery_app worker
      -Q background
      -c ${BACKGROUND_WORKER_CONCURRENCY:-2}
      --beat
      --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ${DATA_ROOT}/artifacts:/data/artifacts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    # No host port — nginx proxies to this container internally.
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Port 80 on the host is owned by di_nginx (another project on this server).
      # ChipAtelier listens on 8080. To serve on 80/443, add a proxy_pass block
      # inside di_nginx pointing to localhost:8080.
      - "8080:80"
      # VNC container ports are mapped to the host so Nginx can proxy_pass to
      # 127.0.0.1:$vnc_port when a session is active.
      - "6080-6099:6080-6099"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # VNC viewer image — built here but containers are spawned dynamically by the worker.
  # This service is never started directly; it exists only to trigger a docker build
  # so the image is available when start_vnc task runs containers.run().
  vnc-viewer:
    build:
      context: ./vnc-container
    image: chipatelier/vnc-viewer:latest
    profiles:
      - build-only  # Never started by docker compose up; image built for worker use
    volumes:
      - ${DATA_ROOT}/artifacts:/artifacts:ro  # DEF/LEF files from ORFS job runs

