services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chipatelier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-chipatelier}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chipatelier}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-chipatelier}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-chipatelier}
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # ORFS job workers — dedicated queue for long-running ORFS jobs
  orfs-worker:
    build:
      context: ./worker
    command: >
      celery -A worker.celery_app worker
      -Q orfs_jobs
      -c ${ORFS_WORKER_CONCURRENCY:-4}
      --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - artifacts_data:/data/artifacts
    restart: unless-stopped

  # Background workers — dedicated queue for tiles, grading, AI hints
  background-worker:
    build:
      context: ./worker
    command: >
      celery -A worker.celery_app worker
      -Q background
      -c ${BACKGROUND_WORKER_CONCURRENCY:-2}
      --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - artifacts_data:/data/artifacts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # VNC container ports are mapped to the host network (127.0.0.1) so Nginx
      # can proxy_pass to them via 127.0.0.1:$vnc_port. VNC containers publish
      # their websockify port (6080-6099) to the host when spawned by the worker.
      - "6080-6099:6080-6099"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # VNC viewer image — built here but containers are spawned dynamically by the worker.
  # This service is never started directly; it exists only to trigger a docker build
  # so the image is available when start_vnc task runs containers.run().
  vnc-viewer:
    build:
      context: ./vnc-container
    image: chipatelier/vnc-viewer:latest
    profiles:
      - build-only  # Never started by docker compose up; image built for worker use
    volumes:
      - artifacts_data:/artifacts:ro  # DEF/LEF files from ORFS job runs

volumes:
  postgres_data:
  minio_data:
  artifacts_data:
