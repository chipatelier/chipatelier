[project]
name = "chipatelier-backend"
version = "0.1.0"
description = "ChipAtelier FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg==0.29.*",
    "alembic==1.13.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "PyJWT==2.10.*",
    "argon2-cffi==25.*",
    "celery[redis]==5.4.*",
    "redis[asyncio]==5.*",
    "boto3==1.35.*",
    "docker==7.1.*",
    "httpx==0.27.*",
    "python-multipart==0.0.12",
    "aiofiles==24.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.24.*",
    "anyio==4.*",
    "httpx",
    "moto[s3]",
    "fakeredis",
    "aiosqlite",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.*",
    "pytest-asyncio==0.24.*",
    "anyio==4.*",
    "httpx",
    "moto[s3]",
    "fakeredis",
    "aiosqlite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
